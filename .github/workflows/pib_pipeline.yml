# Save as: .github/workflows/pipeline.yml   (replace the contents of your existing workflow file)
#
# Every night this fetches the PREVIOUS day's PIB releases, cleans them,
# summarizes them with Sarvam, and saves the three layers in R2:
#   bronze (raw)  ->  silver (cleaned)  ->  gold (summaries)
#
# It is scheduled THREE times before 05:00 IST. The first run that finishes
# successfully writes a "done" marker for that day (in R2, under _state/done/);
# the other runs see the marker and stop within about a minute. If a run fails,
# or GitHub skips or delays it, the next one tries again.

name: PIB pipeline

on:
  schedule:
    # GitHub cron is always UTC (IST = UTC + 5:30). All three are on the same UTC
    # evening, so all three work out the same "yesterday in IST" day.
    - cron: "31 18 * * *"   # 00:01 IST  first attempt
    - cron: "11 20 * * *"   # 01:41 IST  retry if the first failed or never started
    - cron: "41 21 * * *"   # 03:11 IST  last retry (still well before 05:00 IST)

  workflow_dispatch:   # the "Run workflow" button, for manual tests
    inputs:
      date:
        description: "Day to fetch, YYYY-MM-DD (leave empty for yesterday in IST)"
        required: false
        default: ""

# Never let two runs overlap: they would fight over the same state files.
concurrency:
  group: pib-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # Pinned on purpose: 'ubuntu-latest' is due to switch to Ubuntu 26 on 19 Oct 2026,
    # and the browser/system packages below are known to work on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Fails in seconds, and says exactly WHICH secret is missing or empty
      # (it never prints the values).
      - name: Check secrets are set
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET SARVAM_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "MISSING or empty secret: $name"
              missing=1
            else
              echo "ok: $name"
            fi
          done
          exit $missing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only what r2_sync.py needs. The big installs come later, and only if
      # there is real work to do (so a "day already done" run is quick).
      - name: Install R2 tools
        run: pip install boto3 python-dotenv

      # The runner's clock is UTC, but "yesterday" must be yesterday in India.
      # At 00:01 IST the UTC date is still the OLD day, so asking the pipeline
      # for "yesterday" by UTC would fetch the wrong day. We compute it in IST.
      - name: Work out which day to fetch
        id: day
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            if [[ ! "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Date must look like 2026-10-05, got: $INPUT_DATE"
              exit 1
            fi
            DAY="$INPUT_DATE"
          else
            DAY=$(TZ=Asia/Kolkata date -d "yesterday" +%F)
          fi
          echo "Fetching PIB releases for $DAY"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"

      # The runner starts empty. Pull the dedup state (including the "done"
      # markers) and recent days from R2.
      - name: Restore data from R2
        run: python scripts/r2_sync.py download --since-days 7

      # Scheduled runs stop here if an earlier run already finished this day.
      # Manual runs (the button) always go ahead, so you can redo a day on purpose.
      - name: Check if this day is already done
        id: check
        env:
          DAY: ${{ steps.day.outputs.day }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ -f "data/.state/done/$DAY.txt" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "$DAY was already completed by an earlier run. Nothing to do."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.done != 'true'
        run: pip install sarvamai -r requirements.txt -r pipeline/extract/requirements_extract.txt

      # The day-by-day fetch (--backfill) drives a real browser with Playwright.
      # It needs Chromium, and because headless Chromium gets blocked on
      # allRel.aspx, it runs "visible" inside a virtual screen (xvfb) -- the
      # Linux fix described in backfill_fetcher.py.
      - name: Install browser (Playwright) and virtual screen
        if: steps.check.outputs.done != 'true'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      # Bronze (data/raw) and Silver (data/processed) for that one day.
      - name: Fetch, parse and clean
        if: steps.check.outputs.done != 'true'
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: xvfb-run -a python pipeline/pipeline.py --backfill "$DAY"

      # If the fetch fails, keep the screenshots of what the browser saw.
      # Download them from the "Artifacts" section at the bottom of the run page.
      - name: Save debug screenshots (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug_*.png
            pipeline/debug_*.png
          if-no-files-found: ignore

      # Gold (data/exports). Articles that already have a summary are skipped.
      - name: Summarize with Sarvam
        if: steps.check.outputs.done != 'true'
        run: python pipeline/summarize/sarvam_summarizer.py

      # Only reached if the fetch AND the summaries both succeeded. This is what
      # tells the later scheduled runs of the night to stand down.
      - name: Mark this day as done
        if: steps.check.outputs.done != 'true'
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          mkdir -p data/.state/done
          echo "completed $(date -u +%FT%TZ) by run ${{ github.run_id }}" > "data/.state/done/$DAY.txt"

      # always(): even if a step above fails, keep what was produced.
      - name: Upload layers to R2
        if: always() && steps.check.outputs.done != 'true'
        run: python scripts/r2_sync.py upload
